services:

  usersapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usersapi
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UsersDB=Server=sqlserver;Database=UsersDB;User Id=sa;Password=Sa12345678!;TrustServerCertificate=True
      - JwtSettings__SecretKey=troque-esta-chave-em-producao-conexao-solidaria-2026
      - JwtSettings__ExpiracaoHoras=2
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - conexao-solidaria-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Sa12345678!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Sa12345678!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - conexao-solidaria-network

networks:
  conexao-solidaria-network:
    driver: bridge
